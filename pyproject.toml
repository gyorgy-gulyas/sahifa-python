[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sahifa"
version = "1.0.0"
description = "Arabic-ready HTML to PDF and screenshot API client, rendered in Saudi Arabia (Sahifa)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yimello LLC", email = "support@sahifa.dev" }]
keywords = ["pdf", "html-to-pdf", "arabic", "rtl", "screenshot", "zatca", "invoice", "saudi-arabia", "reportlab-alternative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Printing",
  "Natural Language :: Arabic",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://sahifa.dev/en/"
Documentation = "https://sahifa.dev/en/docs"
Source = "https://github.com/gyorgy-gulyas/sahifa-python"
Issues = "https://github.com/gyorgy-gulyas/sahifa-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sahifa"]
